# Subscriptions cell: one of the ten finance services split from the retired finance_* tables (2026-10-12).
# Recurring costs, their value reviews and the aliases that map statement lines to them.
# Amounts are real (float) like every kit cell; cross-cell ids (account_id, ...) are plain bigints, not foreign keys.
cell: subscriptions
title: Subscriptions
resources:
  subscription:
    filters:
    - status
    - owner_scope
    - provider
    - billing_interval
    - category
    unique:
    - - name
      - provider
      - owner_scope
    fields:
      name:
        type: text
        required: true
        max_length: 200
      provider:
        type: text
        required: true
        max_length: 200
      category:
        type: text
        default: software
      owner_scope:
        type: enum
        values:
        - personal
        - solo_empire
        - venture
        - client
        - shared
        default: solo_empire
      status:
        type: enum
        values:
        - trial
        - active
        - paused
        - cancelled
        - expired
        default: active
      billing_interval:
        type: enum
        values:
        - weekly
        - monthly
        - quarterly
        - yearly
        - one_time
        - usage
        default: monthly
      amount:
        type: real
        min: 0
        required: true
      currency:
        type: text
        default: THB
        max_length: 12
      started_on:
        type: date
      next_billing_date:
        type: date
      cancelled_on:
        type: date
      auto_renew:
        type: bool
        default: true
      account_id:
        type: bigint
      project_id:
        type: bigint
      goal_id:
        type: bigint
      source_ref:
        type: text
      notes: &id001
        type: text
  subscription-review:
    filters:
    - subscription_id
    - verdict
    unique:
    - - subscription_id
      - review_date
    order: review_date
    fields:
      subscription_id:
        type: ref
        to: subscription
        required: true
      review_date:
        type: date
        required: true
      period_start:
        type: date
        required: true
      period_end:
        type: date
        required: true
      usage_events:
        type: int
        min: 0
      usage_hours:
        type: real
        min: 0
      time_saved_hours:
        type: real
        min: 0
      usage_complete:
        type: bool
        default: false
      hourly_value:
        type: real
        min: 0
      value_currency:
        type: text
        max_length: 12
      revenue_attributed:
        type: real
        min: 0
      revenue_currency:
        type: text
        max_length: 12
      value_score:
        type: int
        min: 0
        max: 100
      verdict:
        type: enum
        values:
        - worth_it
        - conditional
        - not_worth_it
        - insufficient_data
        default: insufficient_data
      evidence:
        type: text
      notes: *id001
      next_review_date:
        type: date
  subscription-alias:
    table: subscription_aliases
    plural: subscription-aliases
    filters:
    - subscription_id
    - mapping_status
    fields:
      alias:
        type: text
        required: true
        unique: true
        max_length: 300
      subscription_id:
        type: ref
        to: subscription
      mapping_status:
        type: enum
        values:
        - resolved
        - unresolved
        default: unresolved
      evidence:
        type: text
      source:
        type: text
        default: subscription-review
  subscription-usage:
    plural: subscription-usages
    filters:
    - subscription_id
    - outcome
    order: used_on
    fields:
      subscription_id:
        type: ref
        to: subscription
        required: true
      used_on:
        type: date
        required: true
      title:
        type: text
        required: true
        max_length: 200
      outcome:
        type: enum
        values: [completed, partial, discarded]
        default: completed
      baseline_minutes:
        type: real
        min: 0
      actual_minutes:
        type: real
        min: 0
      rework_minutes:
        type: real
        min: 0
        default: 0
      task_ref:
        type: text
        max_length: 300
      evidence:
        type: text
        max_length: 1500
      source:
        type: text
        max_length: 80
        default: manual
      source_ref:
        type: text
        max_length: 300
  subscription-charge:
    plural: subscription-charges
    filters:
    - subscription_id
    order: paid_on
    fields:
      subscription_id:
        type: ref
        to: subscription
        required: true
      paid_on:
        type: date
        required: true
      period_start:
        type: date
        required: true
      period_end:
        type: date
        required: true
      amount:
        type: real
        min: 0
        required: true
      currency:
        type: text
        required: true
        max_length: 12
      evidence:
        type: text
        required: true
        max_length: 1500
      source:
        type: text
        max_length: 80
        default: manual
      source_ref:
        type: text
        max_length: 300
