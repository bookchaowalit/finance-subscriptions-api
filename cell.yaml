# Subscriptions cell: one of the ten finance services split from the retired finance_* tables (2026-10-12).
# Recurring costs, their value reviews and the aliases that map statement lines to them.
# Amounts are exact (money = numeric(19,4), decimal = numeric(30,10); SPEC-003); cross-cell ids (account_id, ...) are plain bigints, not foreign keys.
cell: subscriptions
title: Subscriptions
resources:
  subscription:
    # SPEC-006: fields of other cells that point here (a referenced record cannot be deleted).
    referenced_by:
    - transactions.transaction.subscription_id
    # SPEC-005: reference data only in events (no amounts, names or notes).
    graph: [scope, status, billing_interval, currency, started_on, next_billing_date, cancelled_on, auto_renew, account_id, project_id, goal_id]
    legacy_columns:
      scope: owner_scope
    filters:
    - status
    - scope
    - provider
    - billing_interval
    unique:
    - - name
      - provider
      - scope
    fields:
      name:
        type: text
        required: true
        max_length: 200
      provider:
        type: text
        required: true
        max_length: 200
      category:
        type: text
        default: software
      scope:
        type: text
        max_length: 64
        default: ''
      status:
        type: enum
        values:
        - trial
        - active
        - paused
        - cancelled
        - expired
        default: active
      billing_interval:
        type: enum
        values:
        - weekly
        - monthly
        - quarterly
        - yearly
        - one_time
        - usage
        default: monthly
      amount:
        type: money
        min: 0
        required: true
      currency:
        type: currency
        default: THB
      started_on:
        type: date
      next_billing_date:
        type: date
      cancelled_on:
        type: date
      auto_renew:
        type: bool
        default: true
      account_id:
        references: finance-accounts.account
        refuse_status: [closed]
        type: bigint
      project_id:
        type: bigint
      goal_id:
        type: bigint
      source_ref:
        type: text
      notes: &id001
        type: text
  subscription-review:
    # SPEC-005: reference data only in events (no amounts, names or notes).
    graph: [subscription_id, review_date, period_start, period_end, verdict, next_review_date]
    filters:
    - subscription_id
    - verdict
    unique:
    - - subscription_id
      - review_date
    ranges:
    - [period_start, period_end]
    order: review_date
    fields:
      subscription_id:
        type: ref
        to: subscription
        required: true
      review_date:
        type: date
        required: true
      period_start:
        type: date
        required: true
      period_end:
        type: date
        required: true
      usage_events:
        type: int
        min: 0
      usage_hours:
        type: real
        min: 0
      time_saved_hours:
        type: real
        min: 0
      revenue_attributed:
        type: money
        min: 0
      revenue_currency:
        type: currency
      value_score:
        type: int
        min: 0
        max: 100
      verdict:
        type: enum
        values:
        - worth_it
        - conditional
        - not_worth_it
        - insufficient_data
        default: insufficient_data
      evidence:
        type: text
      notes: *id001
      next_review_date:
        type: date
  subscription-alias:
    # SPEC-005: reference data only in events (no amounts, names or notes).
    graph: [subscription_id, mapping_status]
    table: subscription_aliases
    plural: subscription-aliases
    filters:
    - subscription_id
    - mapping_status
    fields:
      alias:
        type: text
        required: true
        unique: true
        max_length: 300
      subscription_id:
        type: ref
        to: subscription
      mapping_status:
        type: enum
        values:
        - resolved
        - unresolved
        default: unresolved
      evidence:
        type: text
      source:
        type: text
        default: subscription-review
